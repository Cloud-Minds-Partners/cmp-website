name: prova-wif
on: [pull_request]
permissions: {contents: read, id-token: write}
jobs:
  tenta:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861100775784/locations/global/workloadIdentityPools/github/providers/cmp-website
          service_account: gh-cmp-website-deploy@dcplatformcmp.iam.gserviceaccount.com
          token_format: access_token   # força a troca real; sem isso o auth só grava o arquivo e "passa"
      - run: |
          if [ "${{ steps.auth.outcome }}" = success ]; then echo "VAZOU: PR obteve a credencial"; exit 1; fi
          echo "BARRADO: PR não obteve a credencial"
