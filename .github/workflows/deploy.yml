name: Deploy cmp-website

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".planning/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cmp-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to mint the OIDC token for Workload Identity Federation
      pull-requests: write  # required for preview channel PR comment
    env:
      HAS_KNOWLEDGE_TOKEN: ${{ secrets.CMP_KNOWLEDGE_READ_TOKEN != '' }}

    steps:
      # ------------------------------------------------------------------ #
      # PRE-FLIGHT: hard-fail if required deploy secret is absent           #
      # Per CMP rule #8b — silent-skip is failure. Build must not succeed   #
      # without deploying when on main. Non-main branches deploy preview.   #
      # ------------------------------------------------------------------ #
      - name: Pre-flight — assert WIF secrets present
        run: |
          MISSING=""
          [ -z "${{ secrets.WIF_PROVIDER }}" ] && MISSING="$MISSING WIF_PROVIDER"
          [ -z "${{ secrets.WIF_SERVICE_ACCOUNT }}" ] && MISSING="$MISSING WIF_SERVICE_ACCOUNT"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repo secret(s):$MISSING"
            echo "Deploy authenticates by Workload Identity Federation — there is no service"
            echo "account key, because the organization blocks key creation"
            echo "(iam.disableServiceAccountKeyCreation). Do NOT generate one."
            echo "Provider: projects/861100775784/locations/global/workloadIdentityPools/github/providers/cmp-website"
            echo "Service account: gh-cmp-website-deploy@dcplatformcmp.iam.gserviceaccount.com"
            exit 1
          fi
          echo "WIF secrets present — continuing."

      # ------------------------------------------------------------------ #
      # CHECKOUT                                                             #
      # ------------------------------------------------------------------ #
      - name: Checkout cmp-website
        uses: actions/checkout@v4
        with:
          path: cmp-website

      # Auth via Workload Identity Federation (no long-lived key). The job
      # exchanges its GitHub OIDC token for short-lived credentials
      # impersonating the deploy service account. Mirror of
      # cmp-connectivity-intel / site-selection-tool / cmp-grid-margin.
      # Provider is repo-locked to Cloud-Minds-Partners/cmp-website.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Checkout cmp-knowledge (content source)
        if: env.HAS_KNOWLEDGE_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: Cloud-Minds-Partners/cmp-knowledge
          path: cmp-knowledge
          token: ${{ secrets.CMP_KNOWLEDGE_READ_TOKEN }}

      - name: Warn when building without content source
        if: env.HAS_KNOWLEDGE_TOKEN != 'true'
        run: |
          echo "::warning::CMP_KNOWLEDGE_READ_TOKEN not set — content collections will be empty."
          echo "Set the repo secret to deploy published memos/radar/regwatch/people."
          mkdir -p cmp-knowledge/knowledge/memos/published \
                   cmp-knowledge/knowledge/innovation-radar \
                   cmp-knowledge/knowledge/regwatch \
                   cmp-knowledge/people/photos \
                   cmp-knowledge/people/advisors

      - name: Stage people photos into /public/people/photos
        if: env.HAS_KNOWLEDGE_TOKEN == 'true'
        run: |
          mkdir -p cmp-website/public/people/photos
          if [ -d cmp-knowledge/people/photos ]; then
            cp -R cmp-knowledge/people/photos/. cmp-website/public/people/photos/ || true
            echo "copied $(ls cmp-website/public/people/photos | wc -l) photo(s)"
          fi

      # ------------------------------------------------------------------ #
      # BUILD                                                                #
      # ------------------------------------------------------------------ #
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmp-website/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: cmp-website

      - name: Build
        run: npm run build
        working-directory: cmp-website

      # ------------------------------------------------------------------ #
      # POST-BUILD ARTIFACT VALIDATION                                       #
      # Hard-fail if critical routes are missing from dist/                 #
      # ------------------------------------------------------------------ #
      - name: Validate build artifacts
        run: |
          MISSING=0
          check() {
            if [ ! -e "cmp-website/dist/$1" ]; then
              echo "::error::Missing build artifact: dist/$1"
              MISSING=$((MISSING+1))
            else
              echo "FOUND: dist/$1"
            fi
          }
          check "index.html"
          check "sitemap-index.xml"
          check "robots.txt"
          check "404.html"
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING artifact(s) missing from dist/ — aborting deploy."
            exit 1
          fi
          echo "All required artifacts present."

      # ------------------------------------------------------------------ #
      # LIGHTHOUSE CI                                                        #
      # Perf ≥ 0.9, A11Y ≥ 0.95, SEO ≥ 0.95                              #
      # Runs against static dist/ (no server needed)                        #
      # ------------------------------------------------------------------ #
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
        working-directory: cmp-website

      - name: Run Lighthouse CI
        run: lhci autorun
        working-directory: cmp-website
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # ------------------------------------------------------------------ #
      # DEPLOY — Preview channel (non-main branches)                        #
      # Deployed with the firebase CLI under WIF credentials             #
      # ------------------------------------------------------------------ #
      # firebase-tools is pinned: 15.22.3 (2026-06-25) regressed WIF/
      # external_account ADC auth — deploys failed with "Failed to authenticate,
      # have you run firebase login?" even with credentials exported. 15.22.2 is
      # the last good release (mirror of the other CMP repos).
      #
      # The retry loop is not defensive padding: WIF auth is intermittently
      # rejected by firebase-tools even on the pinned version. auth@v2 always
      # mints the credentials; the CLI occasionally fails to use them.
      - name: Deploy preview channel
        if: github.ref != 'refs/heads/main'
        working-directory: cmp-website
        run: |
          npm install -g firebase-tools@15.22.2
          CHANNEL="preview-$(echo "${{ github.head_ref || github.ref_name }}" | tr '/_' '--' | tr -cd 'a-zA-Z0-9-' | cut -c1-40)"
          n=1; max=6
          until firebase hosting:channel:deploy "$CHANNEL" --only cmp-website \
                  --expires 7d --project dcplatformcmp --non-interactive; do
            if [ $n -ge $max ]; then echo "::error::preview deploy failed after $max attempts"; exit 1; fi
            echo "::warning::attempt $n failed (intermittent WIF auth) — retry in 30s"; n=$((n+1)); sleep 30
          done

      # ------------------------------------------------------------------ #
      # DEPLOY — Live channel (main only)                                   #
      # ------------------------------------------------------------------ #
      - name: Deploy live
        if: github.ref == 'refs/heads/main'
        working-directory: cmp-website
        run: |
          npm install -g firebase-tools@15.22.2
          n=1; max=6
          until firebase deploy --only hosting:cmp-website --project dcplatformcmp --non-interactive; do
            if [ $n -ge $max ]; then echo "::error::live deploy failed after $max attempts"; exit 1; fi
            echo "::warning::attempt $n failed (intermittent WIF auth) — retry in 30s"; n=$((n+1)); sleep 30
          done
